[package]
name = "prism-merkle"
version = "0.1.0"
edition = "2021"
description = "PRISM Merkle Tree with 2-of-3 Ed25519 Witness Cosigning (RFC 6962)"

[dependencies]
prism-common = { path = "../prism-common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
rand = "0.8"
hex = "0.4"
blake3 = "1.5"