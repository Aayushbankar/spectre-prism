[package]
name = "prism-drain"
version = "0.1.0"
edition = "2021"
description = "Drain log clustering with specificity scoring and Laya enrichment"

[dependencies]
prism-common = { path = "../prism-common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
prism-vrl-generator = { path = "../prism-vrl-generator" }