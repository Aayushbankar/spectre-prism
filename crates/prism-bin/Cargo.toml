[package]
name = "prism"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "prism"
path = "src/main.rs"

[dependencies]
prism-common = { path = "../prism-common" }
prism-core = { path = "../prism-core" }
prism-ingest = { path = "../prism-ingest" }
prism-provenance = { path = "../prism-provenance" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
serde_json = "1.0"
uuid = { version = "1.26.1", features = ["v4"] }
rand = "0.10.3"
