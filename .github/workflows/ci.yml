name: CI

on:
  push:
    branches: [ "main", "master", "feat/**" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: PRISM Full CI Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Strict Verification of Visual Assets, Links & Diagrams
        run: python3 scripts/verify_visuals_and_docs.py

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust Workspace Tests
        run: cargo test --workspace

      - name: Build Rust Release Binaries
        run: cargo build --release
